name: store
description: "Beauty & Elegance Luxury E-Commerce App built with Flutter Clean Architecture"
publish_to: 'none'
version: 1.2.0+19

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Architecture & State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # UI & Responsiveness
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.3.3
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.3
  flutter_svg: ^2.2.4
  image_picker: ^1.2.1

  # Networking & Utilities
  dio: ^5.9.1
  shared_preferences: ^2.5.4
  intl: ^0.20.2
  geolocator: ^14.0.2
  google_maps_flutter: ^2.18.1

  # Push Notifications (FCM / FlutterFire) + Support Chat
  firebase_core: ^3.15.0
  firebase_messaging: ^15.2.5
  firebase_auth: ^5.6.0
  cloud_firestore: ^5.6.0
  flutter_local_notifications: ^19.4.0
  uuid: ^4.5.1
  url_launcher: ^6.3.2
  package_info_plus: ^9.0.0
  connectivity_plus: ^7.3.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  firebase_crashlytics: ^4.3.10
  share_plus: ^12.0.2
  app_links: 6.4.1

  # The following adds the Cupertino Icons font to your application.
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
